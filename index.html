<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F7F2E7;
    color: #2B2E22;
    font-family: 'Pretendard','Noto Sans KR',-apple-system,sans-serif;
  }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid #4C7A52; outline-offset: 1px;
  }
  header {
    background: linear-gradient(135deg, #2F4A38 0%, #3D5C46 100%); color: #F7F2E7; padding: 22px 28px;
  }
  .header-inner {
    max-width: 1080px; margin: 0 auto; display: flex; justify-content: space-between;
    align-items: flex-end; flex-wrap: wrap; gap: 16px;
  }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: #B9CBA8; font-weight: 500; }
  h1 { margin: 4px 0 0; font-family: 'Noto Serif KR', serif; font-size: 24px; font-weight: 700; }
  .mode-toggle { display: flex; gap: 4px; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 8px; }
  .mode-btn {
    padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500;
    background: transparent; color: #DCE8D2; position: relative;
  }
  .mode-btn.active { background: #F7F2E7; color: #2F4A38; }
  .badge-count {
    margin-left: 6px; background: #C98A2C; color: #fff; border-radius: 999px;
    font-size: 11px; padding: 1px 6px; font-weight: 700;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px; }
  .card {
    background: #FFFEFA; border: 1px solid #E3DAC5; border-radius: 14px; padding: 20px;
    box-shadow: 0 1px 3px rgba(47,74,56,0.06), 0 1px 2px rgba(47,74,56,0.04);
  }
  .card h2 { margin: 0 0 4px; font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700; }
  .card .sub { margin: 0 0 16px; font-size: 12.5px; color: #8D8570; }
  label.field { display: block; margin-bottom: 14px; }
  label.field span { display: block; font-size: 13px; font-weight: 500; color: #4F4A38; margin-bottom: 5px; }
  .input {
    width: 100%; padding: 9px 11px; border: 1px solid #D8CFB8; border-radius: 6px;
    font-size: 16px; background: #FFFCF5; color: #2B2E22;
  }
  @media (min-width: 640px) {
    .input { font-size: 14px; }
  }
  textarea.input { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .submit-btn {
    width: 100%; padding: 11px; background: #4C7A52; color: #fff; border: none;
    border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .nav-btn {
    padding: 7px 12px; border: 1px solid #D8CFB8; border-radius: 6px; background: #FFFCF5;
    font-size: 13px; cursor: pointer; color: #4F4A38;
  }
  .date-nav { margin-bottom: 16px; }
  .date-nav-top {
    display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px;
  }
  .date-nav .date-label { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 16px; min-width: 130px; text-align: center; }
  .nav-btn-icon { padding: 6px 12px; font-weight: 700; }
  .date-nav-bottom { display: flex; align-items: center; gap: 8px; }
  .date-nav-bottom .input { flex: 1; min-width: 0; }
  .date-nav-bottom .nav-btn { flex-shrink: 0; }
  .grid-2col { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  .grid-2col-rev { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
  @media (max-width: 760px) {
    .grid-2col, .grid-2col-rev { grid-template-columns: 1fr; }
    main { padding: 16px !important; }
    header { padding: 16px 18px !important; }
    h1 { font-size: 19px !important; }
    .nav-btn, .filter-btn, .mode-btn { padding: 10px 14px; min-height: 40px; }
    .submit-btn { padding: 14px; font-size: 15px; }
    .res-actions button { min-height: 38px; padding: 8px 12px; }
  }
  .spinner {
    width: 18px; height: 18px; border: 2px solid #E3DAC5; border-top-color: #4C7A52;
    border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-box { display: flex; align-items: center; padding: 20px; color: #71695A; font-size: 13.5px; }
  .empty-box { text-align: center; padding: 32px 16px; color: #8D8570; font-size: 13.5px; }
  .past-flag { font-size: 11px; font-weight: 700; color: #B25C3E; margin-left: 6px; }
  .processed-by { font-size: 11.5px; color: #8D8570; margin-top: 4px; }

  .view-toggle { display: flex; gap: 4px; background: #EFE7D6; padding: 3px; border-radius: 8px; margin-bottom: 12px; width: fit-content; }
  .view-toggle button {
    padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12.5px; font-weight: 500;
    background: transparent; color: #4F4A38;
  }
  .view-toggle button.active { background: #FFFEFA; color: #2F4A38; font-weight: 700; }

  .cal-wrap { }
  .cal-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .cal-month-label { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 16px; min-width: 100px; text-align: center; }
  .cal-weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-weekday-row span { text-align: center; font-size: 11.5px; color: #8D8570; font-weight: 500; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1; border: 1px solid #E3DAC5; border-radius: 8px; background: #FFFEFA;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; padding: 2px; font-family: inherit;
  }
  .cal-cell:hover { border-color: #4C7A52; }
  .cal-empty { border: none; background: transparent; cursor: default; }
  .cal-daynum { font-size: 12.5px; color: #2B2E22; }
  .cal-today { border: 1.5px solid #4C7A52; }
  .cal-today .cal-daynum { color: #2F4A38; font-weight: 700; }
  .cal-selected { background: #E7F0DE; border-color: #4C7A52; }
  .cal-dots { display: flex; gap: 3px; height: 6px; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-dot-pending { background: #C98A2C; }
  .cal-dot-approved { background: #3F7A45; }
  .cal-cell.cal-closed { background: #EFE7D6; opacity: 0.65; }
  .cal-closed-label { font-size: 9px; color: #8D8570; }
  .cal-cell { position: relative; }
  .cal-tooltip {
    display: none; position: absolute; top: 100%; left: 50%; margin-top: 6px;
    transform: translateX(-50%); width: max-content; max-width: min(240px, 80vw);
    max-height: 200px; overflow-y: auto; text-align: left; white-space: normal;
    background: #2B2A27; color: #FFFEFA; border-radius: 8px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5; box-shadow: 0 6px 16px rgba(0,0,0,0.18); z-index: 40;
  }
  .cal-cell:hover .cal-tooltip, .cal-cell:focus-visible .cal-tooltip { display: block; }
  .cal-tip-date { font-weight: 700; margin-bottom: 4px; }
  .cal-tip-row { display: flex; align-items: baseline; gap: 5px; margin-top: 3px; }
  .cal-tip-row + .cal-tip-row { padding-top: 3px; border-top: 1px solid rgba(255,255,255,0.12); }
  .cal-tip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cal-tip-time { font-family: ui-monospace,'SF Mono',Menlo,monospace; flex-shrink: 0; color: #D8D2C2; }
  .cal-tip-room { flex-shrink: 0; color: #C3D6B8; }
  .cal-tip-name { min-width: 0; word-break: keep-all; overflow-wrap: break-word; }
  .closed-day-note {
    margin: 0 0 10px; padding: 8px 12px; background: #F6E3D8; border: 1px solid #B25C3E;
    color: #7A3D24; border-radius: 6px; font-size: 12.5px; font-weight: 500;
  }
  .ledger { border: 1px solid #E3DAC5; border-radius: 10px; overflow: hidden; }
  .ledger-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-top: 1px solid #EFE7D6; position: relative; background: #FFFFFF;
  }
  .ledger-row:first-child { border-top: none; }
  .ledger-row.compact { padding: 6px 12px; }
  .ledger-time { font-family: ui-monospace,'SF Mono',Menlo,monospace; font-size: 12.5px; color: #71695A; width: 46px; flex-shrink: 0; }
  .ledger-bar { flex: 1; height: 20px; border-radius: 4px; border: 1px dashed #E6DFCB; }
  .ledger-row.compact .ledger-bar { height: 16px; }
  .ledger-status { font-size: 11.5px; font-weight: 700; flex-shrink: 0; }
  .ledger-head {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: #F1EADA; border-bottom: 1px solid #E3DAC5;
  }
  .ledger-head .ledger-time { color: #A39A87; }
  .ledger-roomname {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: #4F4A38;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ledger-roomname .cap { font-weight: 500; color: #8D8570; }
  .ledger-cell { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .ledger-cell .ledger-bar { flex: 1; }
  .ledger-cell .ledger-status { width: 54px; white-space: nowrap; }
  /* 좁은 화면에서는 상태 글자를 숨기고 색 막대만 보여줍니다(범례로 구분) */
  @media (max-width: 560px) {
    .ledger-cell .ledger-status { display: none; }
    .ledger-head .cap { display: none; }
  }
  .ledger-head.compact { padding: 7px 12px; }
  .ledger-head.compact .ledger-roomname { font-size: 11px; }
  .ledger-head.compact .cap { display: none; }
  .room-pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; background: #E4ECDD; color: #2F4A38; border: 1px solid #C3D6B8;
  }
  .filter-row-label { font-size: 12px; color: #8D8570; align-self: center; margin-right: 2px; }
  .now-line { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #B25C3E; }
  .legend { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #71695A; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }
  .res-row { border: 1px solid #E6DFCB; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #FFFDF7; }
  .res-row .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .res-row .time-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .res-row .time-mono { font-family: ui-monospace,monospace; font-size: 13px; font-weight: 700; color: #2F4A38; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid; }
  .res-row .meta { margin: 2px 0 0; font-size: 13.5px; font-weight: 500; }
  .res-row .purpose { margin: 4px 0 0; font-size: 13px; color: #71695A; }
  .res-row .reject-reason { margin: 6px 0 0; font-size: 12.5px; color: #7A3D24; }
  .res-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-approve {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #4C7A52; background: #4C7A52;
    color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn-reject {
    padding: 6px 12px; border-radius: 6px; border: 1px solid #B25C3E; background: #fff;
    color: #B25C3E; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .filter-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 14px; border-radius: 999px; border: 1px solid #D8CFB8; cursor: pointer; font-size: 13px;
    background: #FFFCF5; color: #4F4A38; font-weight: 500;
  }
  .filter-btn.active { background: #2F4A38; color: #fff; font-weight: 700; border-color: #2F4A38; }
  .csv-btn {
    padding: 7px 14px; border-radius: 6px; border: 1px solid #4C7A52; background: #fff;
    color: #4C7A52; font-size: 13px; font-weight: 700; cursor: pointer; margin-left: auto;
  }
  .bulk-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 8px 12px;
    background: #EFE7D6; border-radius: 8px; flex-wrap: wrap;
  }
  .bulk-select-all { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4F4A38; cursor: pointer; }
  .bulk-select-all input { width: 15px; height: 15px; accent-color: #4C7A52; }
  .bulk-delete-btn { margin-left: auto; border-color: #B25C3E; color: #B25C3E; }
  .bulk-delete-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; border: 1px solid; }
  .banner-error { background: #F6E3D8; border-color: #B25C3E; color: #7A3D24; }
  .banner-notice { color: #2E5A34; font-size: 13px; margin-bottom: 10px; }
  .banner-pending { background: #FBF3E4; border-color: #C98A2C; color: #7A5312; font-weight: 700; }
  .signin-box { text-align: center; padding: 48px 20px; }
  .signin-box p { color: #71695A; font-size: 13.5px; margin: 8px 0 20px; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: #fff;
    border: 1px solid #D8CFB8; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .muted { color: #8D8570; font-size: 13.5px; }
  .hidden { display: none !important; }
  .signed-in-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: #4F4A38; }
  /* ---------- 사용 주의사항 동의 팝업 ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(28, 33, 24, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal {
    background: #FFFDF7; border-radius: 14px; width: 100%; max-width: 560px;
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 18px 48px rgba(28, 33, 24, 0.28);
  }
  .modal-head {
    padding: 18px 22px 14px; border-bottom: 1px solid #EFE7D6;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .modal-head h2 { margin: 0; font-family: 'Noto Serif KR', serif; font-size: 18px; color: #2F4A38; }
  .agree-version { font-size: 12px; color: #8D8570; font-family: ui-monospace,'SF Mono',Menlo,monospace; }
  .modal-body { padding: 18px 22px; overflow-y: auto; }
  .agree-summary { background: #F3EEE1; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .agree-summary .time-mono { margin-left: 8px; }
  .agree-summary-sub { margin: 6px 0 0; font-size: 13px; color: #4F4A38; }
  .agree-list { margin: 0 0 18px; padding-left: 20px; }
  .agree-list li { font-size: 13.5px; line-height: 1.75; color: #3B3F30; margin-bottom: 6px; }
  .agree-empty {
    margin: 0 0 18px; padding: 18px 16px; border: 1px dashed #D8CFB8; border-radius: 10px;
    font-size: 13px; color: #8D8570; text-align: center; line-height: 1.7; background: #FAF6EC;
  }
  .agree-empty code { background: #EFE7D6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .sign-box {
    border: 1px solid #D8CFB8; border-radius: 10px; padding: 14px 16px; background: #FFFFFF;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .sign-label { font-size: 12px; color: #8D8570; flex-shrink: 0; }
  .sign-name {
    font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: #2B2E22;
    border-bottom: 2px solid #2F4A38; padding: 0 10px 2px; flex: 1; min-width: 100px;
  }
  .sign-date { font-size: 12.5px; color: #71695A; font-family: ui-monospace,'SF Mono',Menlo,monospace; }
  .modal-agree { padding: 14px 22px; border-top: 1px solid #EFE7D6; background: #FAF6EC; flex-shrink: 0; }
  .agree-check { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: #3B3F30; line-height: 1.6; cursor: pointer; }
  .agree-check input { margin-top: 3px; width: 16px; height: 16px; accent-color: #4C7A52; flex-shrink: 0; }
  .modal-foot {
    padding: 14px 22px 18px; border-top: 1px solid #EFE7D6; flex-shrink: 0;
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .modal-foot .submit-btn { width: auto; margin: 0; padding: 11px 22px; }
  .modal-foot .submit-btn:disabled { background: #C6C0AE; cursor: not-allowed; }
  .agree-flag {
    display: inline-block; margin-top: 6px; font-size: 12px; color: #2E5A34;
    background: #E7F0DE; border: 1px solid #C3D6B8; border-radius: 6px; padding: 2px 8px;
  }
  @media (max-width: 560px) {
    .modal-foot { flex-direction: column-reverse; }
    .modal-foot button { width: 100%; }
  }
  .signed-in-bar button { background: none; border: none; text-decoration: underline; cursor: pointer; color: #71695A; font-size: 13px; }
</style>

/* ---------- 시간/날짜 유틸 ---------- */
function timeOptions(start, end, stepMin) {
  const out = [];
  let [h, m] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  while (h < eh || (h === eh && m <= em)) {
    out.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
    m += stepMin;
    if (m >= 60) { m -= 60; h += 1; }
  }
  return out;
}
const START_OPTIONS = timeOptions("09:00", "17:30", 30);
const END_OPTIONS = timeOptions("09:30", "18:00", 30);
const GRID_SLOTS = timeOptions("09:00", "17:30", 30);

function toMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function overlaps(aS, aE, bS, bE) { return toMin(aS) < toMin(bE) && toMin(aE) > toMin(bS); }
function toDateStr(d) {
  // 로컬(브라우저) 타임존 기준으로 YYYY-MM-DD를 만듭니다.
  // toISOString()은 UTC로 변환하기 때문에 한국(UTC+9) 등에서는 날짜가 하루 밀리는 버그가 생겨 사용하지 않습니다.
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() { return toDateStr(new Date()); }
function tomorrowStr() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return toDateStr(d);
}

function isClosedDay(dateStr) {
  const weekday = new Date(dateStr + "T00:00:00").getDay(); // 0=일, 6=토
  return weekday === 0 || weekday === 6 || HOLIDAYS.has(dateStr);
}
function closedDayReason(dateStr) {
  const weekday = new Date(dateStr + "T00:00:00").getDay();
  if (weekday === 0 || weekday === 6) return "주말";
  if (HOLIDAYS.has(dateStr)) return "공휴일";
  return null;
}
function fmtDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function fmtSignDate(d) {
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function csvCell(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCsv(list) {
  if (list.length === 0) { alert("내보낼 예약 데이터가 없습니다."); return; }
  const headers = ["날짜","교육장","시작시간","종료시간","행사명","담당자명","인원","사용목적","상태","거절사유","처리자","처리일시","동의여부","서명자","동의일시","동의문구버전"];
  const rows = list.map((r) => [
    r.date, roomNameOf(r), r.startTime, r.endTime, r.eventName, r.manager, r.attendees, r.purpose,
    statusMeta(r.status).label, r.rejectReason || "", r.processedBy || "", r.processedAt || "",
    r.agreed ? "동의" : "미동의", r.signedName || "", r.signedAt || "", r.agreementVersion || "",
  ]);
  const csv = [headers, ...rows].map((row) => row.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" }); // BOM 포함 - 엑셀 한글 깨짐 방지
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ATEC교육장예약_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// roomId를 넘기면 해당 교육장 건만, 넘기지 않으면 전 교육장을 반환합니다.
function activeDayReservations(date, roomId) {
  return reservations.filter((r) =>
    r.date === date && r.status !== "rejected" && (!roomId || roomIdOf(r) === roomId));
}
function dayReservations(date, roomId) {
  return reservations.filter((r) => r.date === date && (!roomId || roomIdOf(r) === roomId))
    .sort((a, b) => toMin(a.startTime) - toMin(b.startTime));
}

function slotStatusFor(date, slotStart, roomId) {
  const [h, m] = slotStart.split(":").map(Number);
  const endM = m + 30;
  const endStr = endM >= 60
    ? `${String(h + 1).padStart(2, "0")}:${String(endM - 60).padStart(2, "0")}`
    : `${String(h).padStart(2, "0")}:${String(endM).padStart(2, "0")}`;
  const hit = activeDayReservations(date, roomId).find((r) => overlaps(slotStart, endStr, r.startTime, r.endTime));
  return hit ? hit.status : null;
}

function renderLedger(date, compact) {
  const now = new Date();
  const isToday = date === todayStr();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const head = `
    <div class="ledger-head ${compact ? "compact" : ""}">
      <span class="ledger-time"></span>
      ${ROOMS.map((rm) => `
        <span class="ledger-roomname" title="${escapeHtml(rm.name)}">
          ${escapeHtml(rm.name)}<span class="cap"> · ${rm.capacity}명</span>
        </span>`).join("")}
    </div>`;
  const rows = GRID_SLOTS.map((slot) => {
    const isNowLine = isToday && nowMin >= toMin(slot) && nowMin < toMin(slot) + 30;
    const cells = ROOMS.map((rm) => {
      const status = slotStatusFor(date, slot, rm.id);
      const meta = status ? statusMeta(status) : null;
      return `
        <div class="ledger-cell">
          <div class="ledger-bar" style="${meta ? `background:${meta.bg};border:1px solid ${meta.border}` : ""}"></div>
          ${compact ? "" : `<span class="ledger-status" style="color:${meta ? meta.text : "transparent"}">${meta ? meta.label : ""}</span>`}
        </div>`;
    }).join("");
    return `
      <div class="ledger-row ${compact ? "compact" : ""}">
        ${isNowLine ? '<div class="now-line"></div>' : ""}
        <span class="ledger-time">${slot}</span>
        ${cells}
      </div>`;
  }).join("");
  return `<div class="ledger">${head}${rows}</div>`;
}

  const list = reservations.filter((r) => r.date === date && r.status !== "rejected");
  return {

  };
}

function dayTooltipHtml(date) {
  const list = activeDayReservations(date).sort((a, b) => toMin(a.startTime) - toMin(b.startTime));
  if (list.length === 0) return "";

    const meta = statusMeta(r.status);
    return `
      <div class="cal-tip-row">
        <span class="cal-tip-dot" style="background:${meta.border}"></span>
        <span class="cal-tip-time">${r.startTime}~${r.endTime}</span>
        <span class="cal-tip-room">${escapeHtml(roomNameOf(r))}</span>
        <span class="cal-tip-name">${escapeHtml(r.eventName)}</span>
      </div>`;
  }).join("");
  return `<div class="cal-tooltip"><div class="cal-tip-date">${fmtDateLabel(date)}</div>${rows}</div>`;
}

function monthCells(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const year = d.getFullYear(), month = d.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) {
    cells.push(`${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`);
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function renderMonthCalendar(calId, dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const monthLabel = `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  const cells = monthCells(dateStr);
  const todayS = todayStr();

  let weeksHtml = "";
  for (let w = 0; w < cells.length / 7; w++) {
    const weekCells = cells.slice(w * 7, w * 7 + 7).map((c) => {
      if (!c) return `<div class="cal-cell cal-empty"></div>`;
      const stats = dayStats(c);
      const dayNum = Number(c.slice(-2));
      const cls = ["cal-cell"];
      if (c === todayS) cls.push("cal-today");
      if (c === dateStr) cls.push("cal-selected");
      if (isClosedDay(c)) cls.push("cal-closed");
      return `
        <button class="${cls.join(" ")}" data-date="${c}">
          <span class="cal-daynum">${dayNum}</span>
          ${isClosedDay(c)
            ? `<span class="cal-closed-label">휴관</span>`
            : `<span class="cal-dots">
                 ${stats.pending > 0 ? `<span class="cal-dot cal-dot-pending" title="승인 대기 ${stats.pending}건"></span>` : ""}
                 ${stats.approved > 0 ? `<span class="cal-dot cal-dot-approved" title="승인 ${stats.approved}건"></span>` : ""}
               </span>`}
          ${dayTooltipHtml(c)}
        </button>`;
    }).join("");
    weeksHtml += `<div class="cal-week">${weekCells}</div>`;
  }

  return `
    <div class="cal-wrap" id="${calId}">
      <div class="cal-header">
        <button class="nav-btn nav-btn-icon" data-cal-act="prevMonth" title="이전 달">◀</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="nav-btn nav-btn-icon" data-cal-act="nextMonth" title="다음 달">▶</button>
      </div>
      <div class="cal-weekday-row">${weekdays.map((w) => `<span>${w}</span>`).join("")}</div>
      ${weeksHtml}
      <div class="legend" style="margin-top:10px">
        <span class="legend-item"><span class="cal-dot cal-dot-pending"></span>승인 대기</span>
        <span class="legend-item"><span class="cal-dot cal-dot-approved"></span>승인됨</span>
      </div>
    </div>`;
}

function wireMonthCalendar(calId, getDate, setDateStayMonth, setDateAndGoDay) {
  const el = document.getElementById(calId);
  if (!el) return;
  el.querySelector('[data-cal-act="prevMonth"]').addEventListener("click", () => {
    const d = new Date(getDate() + "T00:00:00");
    d.setMonth(d.getMonth() - 1, 1);
    setDateStayMonth(toDateStr(d));
  });
  el.querySelector('[data-cal-act="nextMonth"]').addEventListener("click", () => {
    const d = new Date(getDate() + "T00:00:00");
    d.setMonth(d.getMonth() + 1, 1);
    setDateStayMonth(toDateStr(d));
  });
  el.querySelectorAll(".cal-cell[data-date]").forEach((cell) => {
    cell.addEventListener("click", () => setDateAndGoDay(cell.dataset.date));
  });
}

function renderDateNav(navId, date) {
  return `
    <div class="date-nav" id="${navId}">
      <div class="date-nav-top">
        <button class="nav-btn nav-btn-icon" data-act="prev" title="전날" aria-label="전날">◀</button>
        <span class="date-label">${fmtDateLabel(date)}</span>
        <button class="nav-btn nav-btn-icon" data-act="next" title="다음날" aria-label="다음날">▶</button>
      </div>
      <div class="date-nav-bottom">
        <input class="input" type="date" value="${date}" data-act="pick" />
        <button class="nav-btn" data-act="today">오늘</button>
      </div>
    </div>`;
}

function wireDateNav(navId, getDate, setDate) {
  const el = document.getElementById(navId);
  el.querySelector('[data-act="prev"]').addEventListener("click", () => {
    const d = new Date(getDate() + "T00:00:00"); d.setDate(d.getDate() - 1);
    setDate(toDateStr(d));
  });
  el.querySelector('[data-act="next"]').addEventListener("click", () => {
    const d = new Date(getDate() + "T00:00:00"); d.setDate(d.getDate() + 1);
    setDate(toDateStr(d));
  });
  el.querySelector('[data-act="today"]').addEventListener("click", () => setDate(todayStr()));
  el.querySelector('[data-act="pick"]').addEventListener("change", (e) => setDate(e.target.value));
}

function managerSearchResultsHtml(query) {
  const q = query.trim();
  if (!q) {
    return `<p class="muted" style="font-size:13px;">담당자명을 입력하면 그 이름으로 신청된 예약(오늘 이후 일정)을 찾아드립니다.</p>`;
  }
  const todayS = todayStr();
  const matches = reservations
    .filter((r) => r.manager.includes(q) && r.date >= todayS)
    .sort((a, b) => (a.date !== b.date ? a.date.localeCompare(b.date) : toMin(a.startTime) - toMin(b.startTime)));
  if (matches.length === 0) {
    return `<p class="muted" style="font-size:13px;">"${escapeHtml(q)}" 이름으로 신청된 예정된 예약이 없습니다. (지난 예약은 표시되지 않습니다)</p>`;
  }
  return `<p style="font-size:12.5px;color:#8D8570;margin:0 0 8px;">${matches.length}건 찾음 (가까운 날짜순)</p>` +
    matches.map((r) => renderResRow(r, "")).join("");
}

function fmtSignedAtLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : fmtSignDate(d);
}

function renderResRow(r, actionsHtml, showCheckbox, isAdminView) {
  const meta = statusMeta(r.status);
  const isPastPending = r.status === "pending" && r.date < todayStr();
  return `
    <div class="res-row" data-id="${r.id}">
      <div class="top">
        ${showCheckbox ? `<input type="checkbox" class="res-checkbox" data-id="${r.id}" style="margin-top:5px;flex-shrink:0;width:16px;height:16px;accent-color:#4C7A52;" />` : ""}
        <div style="flex:1;min-width:0;">
          <div class="time-badge">
            <span class="room-pill">${escapeHtml(roomNameOf(r))}</span>
            <span class="time-mono">${r.date} · ${r.startTime}~${r.endTime}</span>
            <span class="status-pill" style="background:${meta.bg};color:${meta.text};border-color:${meta.border}">${meta.label}</span>
            ${isPastPending ? `<span class="past-flag">⚠ 지난 날짜(처리 필요)</span>` : ""}
          </div>
          <p class="meta">${escapeHtml(r.eventName)} · 담당 ${escapeHtml(r.manager)} · ${r.attendees}명</p>
          <p class="purpose">${escapeHtml(r.purpose)}</p>
          ${r.status === "rejected" && r.rejectReason ? `<p class="reject-reason">거절 사유: ${escapeHtml(r.rejectReason)}</p>` : ""}
          ${isAdminView && r.status !== "pending" && r.processedBy ? `<p class="processed-by">처리자: ${escapeHtml(r.processedBy)}</p>` : ""}
          ${r.agreed ? `<span class="agree-flag">✓ 사용 주의사항 동의 · ${escapeHtml(r.signedName || r.manager)} · ${escapeHtml(fmtSignedAtLabel(r.signedAt))}${r.agreementVersion ? ` (${escapeHtml(r.agreementVersion)})` : ""}</span>` : ""}
        </div>
        ${actionsHtml ? `<div class="res-actions">${actionsHtml}</div>` : ""}
      </div>
    </div>`;
}

/* ---------- 신청자 화면 ---------- */
function renderApplyView() {
  const list = activeDayReservations(applyDate).sort((a,b)=>toMin(a.startTime)-toMin(b.startTime));
  function nextBookableDate(from) {
    let d = new Date(from + "T00:00:00");
    d.setDate(d.getDate() + 1); // 최소 하루 전(당일 제외)

    return toDateStr(d);
  }
  const formDefaultDate = (applyDate <= todayStr() || isClosedDay(applyDate))
    ? nextBookableDate(applyDate <= todayStr() ? todayStr() : applyDate)
    : applyDate;
  const html = `
    <div class="grid-2col">
      <div class="card">
        <h2>예약 신청</h2>
        <p class="sub">신청 후 담당자 승인이 완료되면 예약이 확정됩니다.</p>
        <form id="applyForm">
          <label class="field"><span>사용 교육장</span>
            <select class="input" id="f-room">
              ${ROOMS.map((rm) => `<option value="${rm.id}" ${rm.id === applyRoom ? "selected" : ""}>${escapeHtml(rm.name)} (최대 ${rm.capacity}명)</option>`).join("")}
            </select>
          </label>
          <label class="field"><span>사용 날짜</span>
            <input class="input" type="date" id="f-date" value="${formDefaultDate}" min="${tomorrowStr()}" required />
          </label>
          <div class="row">
            <div><label class="field"><span>시작 시간</span>
              <select class="input" id="f-start">${START_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join("")}</select>
            </label></div>
            <div><label class="field"><span>종료 시간</span>
              <select class="input" id="f-end">${END_OPTIONS.map(t=>`<option value="${t}" ${t==="10:00"?"selected":""}>${t}</option>`).join("")}</select>
            </label></div>
          </div>
          <label class="field"><span>행사명</span>
            <input class="input" id="f-eventName" maxlength="60" placeholder="청년가공창업 교육 3회차" required />
          </label>
          <div class="row">
            <div style="flex:2"><label class="field"><span>담당자명</span>
              <input class="input" id="f-manager" maxlength="20" placeholder="홍길동" required />
            </label></div>
            <div style="flex:1"><label class="field"><span>인원</span>
              <input class="input" type="number" min="1" max="${roomInfo(applyRoom).capacity}" id="f-attendees" placeholder="15" required />
              <span id="capHint" class="muted" style="font-weight:400; margin-top:4px;">(최대 ${roomInfo(applyRoom).capacity}명)</span>
            </label></div>
          </div>
          <label class="field"><span>사용 목적</span>
            <textarea class="input" id="f-purpose" maxlength="300" placeholder="예: 시제품 시식 평가 및 참가자 피드백 수렴" required></textarea>
          </label>
          <div id="formMsg"></div>
          <button type="submit" class="submit-btn">예약 신청하기</button>
        </form>
      </div>
      <div>
        ${renderDateNav("applyDateNav", applyDate)}
        <div class="view-toggle">
          <button data-viewmode="day" class="${applyCalMode === "day" ? "active" : ""}">일간 보기</button>
          <button data-viewmode="month" class="${applyCalMode === "month" ? "active" : ""}">월간 보기</button>
        </div>
        <div class="card" style="padding:16px">
          ${applyCalMode === "day" ? `
            ${isClosedDay(applyDate) ? `<p class="closed-day-note">🚫 ${closedDayReason(applyDate)}(휴관일)입니다. 이 날짜는 신청할 수 없습니다.</p>` : ""}
            <div class="legend">
              ${["pending","approved","rejected"].map(s=>`
                <span class="legend-item"><span class="legend-swatch" style="background:${STATUS_META[s].bg};border:1px solid ${STATUS_META[s].border}"></span>${STATUS_META[s].label}</span>
              `).join("")}
            </div>
            ${renderLedger(applyDate, false)}
          ` : renderMonthCalendar("applyMonthCal", applyDate)}
        </div>
        ${list.length > 0 ? `
          <div style="margin-top:16px">
            <p style="font-size:13px;font-weight:500;color:#4F4A38;margin-bottom:8px">이 날짜의 예약 (${list.length}건)</p>
            ${list.map(r => renderResRow(r, "")).join("")}
          </div>` : ""}
        <div class="card" style="margin-top:16px">
          <h2>담당자명으로 예약 조회</h2>
          <p class="sub">이름을 입력하면 오늘 이후로 신청한 예약을 찾아드립니다. (지난 예약은 표시되지 않습니다)</p>
          <input class="input" id="managerSearchInput" placeholder="예: 홍길동" value="${escapeHtml(managerSearchQuery)}" />

      e.target.value = formDefaultDate;
      return;
    }

      return;

  });

  });

    wireMonthCalendar("applyMonthCal", () => applyDate,
      (d) => { applyDate = d; renderApplyView(); },
      (d) => { applyDate = d; applyCalMode = "day"; renderApplyView(); }
    );
  }

  roomSelEl.addEventListener("change", () => {

    attEl.max = cap;
    if (Number(attEl.value) > cap) attEl.value = "";
    document.getElementById("capHint").textContent = `(최대 ${cap}명)`;
  });
  document.getElementById("applyForm").addEventListener("submit", submitReservation);
}

let isSubmitting = false;

async function submitReservation(e) {
  e.preventDefault();
  if (isSubmitting) return;

  const msgEl = document.getElementById("formMsg");
  msgEl.innerHTML = "";

  const room = document.getElementById("f-room").value;
  const date = document.getElementById("f-date").value;
  const startTime = document.getElementById("f-start").value;
  const endTime = document.getElementById("f-end").value;
  const eventName = document.getElementById("f-eventName").value.trim();
  const manager = document.getElementById("f-manager").value.trim();
  const attendeesRaw = document.getElementById("f-attendees").value;
  const purpose = document.getElementById("f-purpose").value.trim();

  if (!ROOM_MAP[room]) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">사용할 교육장을 선택해 주세요.</p>`;
    return;
  }
  if (!date || !eventName || !manager || !attendeesRaw || !purpose) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">모든 항목을 입력해 주세요.</p>`;
    return;
  }
  if (date <= todayStr()) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">당일 신청은 불가합니다. 최소 하루 전(내일 이후)까지 신청해 주세요.</p>`;
    return;
  }
  if (isClosedDay(date)) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">${closedDayReason(date)}에는 교육장을 운영하지 않아 신청할 수 없습니다. 평일 중 다른 날짜를 선택해 주세요.</p>`;
    return;
  }
  if (eventName.length > 60 || manager.length > 20) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">행사명은 60자, 담당자명은 20자를 넘을 수 없습니다.</p>`;
    return;
  }
  if (manager.length < 2) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">담당자명을 정확히 입력해 주세요.</p>`;
    return;
  }
  if (purpose.length > 300) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">사용 목적은 300자를 넘을 수 없습니다.</p>`;
    return;
  }
  if (toMin(startTime) >= toMin(endTime)) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">종료 시간은 시작 시간보다 늦어야 합니다.</p>`;
    return;
  }
  const attendees = Number(attendeesRaw);
  if (!Number.isInteger(attendees) || attendees <= 0) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">인원은 1 이상의 숫자로 입력해 주세요.</p>`;
    return;
  }
  const cap = roomInfo(room).capacity;
  if (attendees > cap) {
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">${escapeHtml(roomInfo(room).name)} 수용 인원(최대 ${cap}명)을 초과했습니다. 인원 또는 교육장을 다시 확인해 주세요.</p>`;
    return;
  }

  // 중복/겹침 신청 방지: 같은 교육장에서 승인 대기 중이거나 이미 승인된 예약과 시간이 겹치면 차단
  //  (교육장이 다르면 같은 시간대라도 신청할 수 있습니다)
  const conflict = reservations.find(r =>
    r.date === date && roomIdOf(r) === room && r.status !== "rejected" &&
    overlaps(startTime, endTime, r.startTime, r.endTime));
  if (conflict) {
    const statusLabel = statusMeta(conflict.status).label;
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">${escapeHtml(roomInfo(room).name)}은(는) 이미 ${statusLabel === "승인됨" ? "승인된" : "신청 접수된(승인 대기 중인)"} 예약(${conflict.startTime}~${conflict.endTime}, ${escapeHtml(conflict.eventName)})과 시간이 겹칩니다. 다른 시간대나 다른 교육장을 선택해 주세요.</p>`;
    return;
  }

  // 모든 검증을 통과하면 사용 주의사항 동의 팝업을 띄우고, 동의한 뒤에 실제로 저장합니다.
  openAgreementModal({ room, date, startTime, endTime, eventName, manager, attendees, purpose });
}

/* ---------- 사용 주의사항 동의 팝업 ---------- */
function closeAgreementModal() {
  const el = document.getElementById("agreementBackdrop");
  if (el) el.remove();
  document.removeEventListener("keydown", agreementEscHandler);
}
function agreementEscHandler(e) {
  if (e.key === "Escape") closeAgreementModal();
}

function openAgreementModal(payload) {
  closeAgreementModal();

  const signedAt = new Date();
  const itemsHtml = AGREEMENT_ITEMS.length > 0
    ? `<ol class="agree-list">${AGREEMENT_ITEMS.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}</ol>`
    : `<p class="agree-empty">사용 주의사항 문구가 아직 등록되지 않았습니다.<br/>코드 상단의 <code>AGREEMENT_ITEMS</code> 항목을 채우면 이 자리에 표시됩니다.</p>`;

  const wrap = document.createElement("div");
  wrap.id = "agreementBackdrop";
  wrap.className = "modal-backdrop";
  wrap.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="agreeTitle">
      <div class="modal-head">
        <h2 id="agreeTitle">${escapeHtml(AGREEMENT_TITLE)}</h2>
        ${AGREEMENT_VERSION ? `<span class="agree-version">${escapeHtml(AGREEMENT_VERSION)}</span>` : ""}
      </div>
      <div class="modal-body">
        <div class="agree-summary">
          <span class="room-pill">${escapeHtml(roomInfo(payload.room).name)}</span>
          <span class="time-mono">${payload.date} · ${payload.startTime}~${payload.endTime}</span>
          <p class="agree-summary-sub">${escapeHtml(payload.eventName)} · ${payload.attendees}명</p>
        </div>
        ${itemsHtml}
        <div class="sign-box">
          <span class="sign-label">신청자 서명</span>
          <span class="sign-name">${escapeHtml(payload.manager)}</span>
          <span class="sign-date">${fmtSignDate(signedAt)}</span>
        </div>
      </div>
      <div class="modal-agree">
        <label class="agree-check">
          <input type="checkbox" id="agreeCheck" />
          <span>위 사용 주의사항을 모두 확인하였으며, 이에 동의하고 <b>${escapeHtml(payload.manager)}</b>의 이름으로 서명합니다.</span>
        </label>
      </div>
      <div class="modal-foot">
        <button type="button" class="nav-btn" id="agreeCancel">취소</button>
        <button type="button" class="submit-btn modal-submit" id="agreeConfirm" disabled>동의하고 예약 신청</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  const checkEl = document.getElementById("agreeCheck");
  const confirmEl = document.getElementById("agreeConfirm");
  checkEl.addEventListener("change", () => { confirmEl.disabled = !checkEl.checked; });
  document.getElementById("agreeCancel").addEventListener("click", closeAgreementModal);
  wrap.addEventListener("click", (e) => { if (e.target === wrap) closeAgreementModal(); });
  document.addEventListener("keydown", agreementEscHandler);
  checkEl.focus();

  confirmEl.addEventListener("click", () => {
    if (!checkEl.checked) return;
    confirmEl.disabled = true;
    confirmEl.textContent = "신청 처리 중…";
    saveReservation({
      ...payload,
      agreed: true,
      signedName: payload.manager,
      signedAt: new Date().toISOString(),
      agreementVersion: AGREEMENT_VERSION,
      agreementItems: [...AGREEMENT_ITEMS],   // 동의 당시 문구 원문을 함께 보관
    });
  });
}

/* ---------- 실제 저장 ---------- */
async function saveReservation(data) {
  const msgEl = document.getElementById("formMsg");
  const submitBtn = document.querySelector("#applyForm .submit-btn");
  isSubmitting = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "신청 처리 중…";

  try {
    await addDoc(collection(db, "reservations"), {
      room: data.room, date: data.date, startTime: data.startTime, endTime: data.endTime,
      eventName: data.eventName, manager: data.manager, attendees: data.attendees, purpose: data.purpose,
      agreed: data.agreed, signedName: data.signedName, signedAt: data.signedAt,
      agreementVersion: data.agreementVersion, agreementItems: data.agreementItems,
      status: "pending", rejectReason: "", createdAt: serverTimestamp(),
    });
    closeAgreementModal();
    document.getElementById("applyForm").reset();
    document.getElementById("f-room").value = data.room;   // 폼 초기화 후에도 교육장 선택은 유지
    msgEl.innerHTML = `<p class="banner-notice">${escapeHtml(roomInfo(data.room).name)} 예약 신청이 접수되었습니다. (${escapeHtml(data.signedName)} 서명 · 사용 주의사항 동의 완료) 담당자 승인 후 확정됩니다.</p>`;
  } catch (err) {
    closeAgreementModal();
    msgEl.innerHTML = `<p class="banner-error" style="font-size:13px">신청 중 오류가 발생했습니다: ${escapeHtml(err.message)}</p>`;
  } finally {
    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "예약 신청하기";
  }
}

/* ---------- 담당자 화면 ---------- */
function renderAdminView() {
  if (!currentUser) {
    document.getElementById("adminView").innerHTML = `
      <div class="card signin-box">
        <h2 style="margin-bottom:0">담당자 로그인</h2>
        <p>구글 계정으로 로그인하면 승인 권한을 확인합니다.</p>
        <button class="google-btn" id="googleSignInBtn">Google 계정으로 로그인</button>
      </div>`;
    document.getElementById("googleSignInBtn").addEventListener("click", () => {
      signInWithPopup(auth, provider).catch((e) => showGlobalBanner(`로그인 실패: ${e.message}`));
    });
    return;
  }

  if (!isAdmin) {
    document.getElementById("adminView").innerHTML = `
      <div class="card signin-box">
        <h2 style="margin-bottom:0">권한 없음</h2>
        <p>${escapeHtml(currentUser.email)} 계정은 담당자 목록에 등록되어 있지 않습니다.<br/>관리자에게 Firestore admins 목록 등록을 요청해 주세요.</p>
        <button class="nav-btn" id="signOutBtn">다른 계정으로 로그인</button>
      </div>`;
    document.getElementById("signOutBtn").addEventListener("click", () => signOut(auth));
    return;
  }

  const pendingToday = dayReservations(adminDate).filter(r => r.status === "pending");
  let list = [...reservations].sort((a,b)=> a.date !== b.date ? a.date.localeCompare(b.date) : toMin(a.startTime)-toMin(b.startTime));
  if (adminFilter !== "all") list = list.filter(r => r.status === adminFilter);
  if (adminRoomFilter !== "all") list = list.filter(r => roomIdOf(r) === adminRoomFilter);

  const filters = [["all","전체"],["pending","승인 대기"],["approved","승인됨"],["rejected","거절됨"]];
  const roomFilters = [["all","전체 교육장"], ...ROOMS.map((rm) => [rm.id, rm.name])];

  document.getElementById("adminView").innerHTML = `
    <div class="signed-in-bar">
      <span>담당자: ${escapeHtml(currentUser.email)}</span>
      <button id="signOutBtn2">로그아웃</button>
    </div>
    <div class="grid-2col-rev">
      <div>
        <div class="filter-bar">
          <span class="filter-row-label">교육장</span>
          ${roomFilters.map(([k,l]) => `<button class="filter-btn ${adminRoomFilter===k?"active":""}" data-roomfilter="${k}">${escapeHtml(l)}</button>`).join("")}
        </div>
        <div class="filter-bar">
          <span class="filter-row-label">상태</span>
          ${filters.map(([k,l]) => `<button class="filter-btn ${adminFilter===k?"active":""}" data-filter="${k}">${l}</button>`).join("")}
          <button class="csv-btn" id="csvExportBtn">⬇ CSV 내보내기</button>
        </div>
        ${list.length > 0 ? `
        <div class="bulk-bar">
          <label class="bulk-select-all">
            <input type="checkbox" id="selectAllCheckbox" />
            전체 선택
          </label>
          <span id="selectedCount" class="muted" style="font-size:12.5px"></span>
          <button class="csv-btn bulk-delete-btn" id="bulkDeleteBtn">🗑 선택 삭제</button>
        </div>` : ""}
        <div id="adminList">
          ${list.length === 0
            ? `<div class="card empty-box">해당 조건의 예약이 없습니다.</div>`
            : list.map(r => renderResRow(r,
                (r.status === "pending"
                  ? `<button class="btn-approve" data-act="approve" data-id="${r.id}">승인</button><button class="btn-reject" data-act="reject" data-id="${r.id}">거절</button>`
                  : r.status === "approved"
                    ? `<button class="btn-reject" data-act="reject" data-id="${r.id}">취소·거절</button>`
                    : `<button class="nav-btn" data-act="reopen" data-id="${r.id}">대기로 되돌리기</button>`
                ) + (r.agreed ? `<button class="nav-btn" data-act="printAgreement" data-id="${r.id}">🖨 서약서 인쇄/PDF저장</button>` : ""),
                true,
                true
              )).join("")
          }
        </div>
      </div>
      <div>
        ${renderDateNav("adminDateNav", adminDate)}
        <div class="view-toggle">
          <button data-viewmode="day" class="${adminCalMode === "day" ? "active" : ""}">일간 보기</button>
          <button data-viewmode="month" class="${adminCalMode === "month" ? "active" : ""}">월간 보기</button>
        </div>
        ${isClosedDay(adminDate) ? `<p class="closed-day-note">🚫 ${closedDayReason(adminDate)}(휴관일)입니다.</p>` : ""}
        ${pendingToday.length > 0 ? `<div class="banner banner-pending">이 날짜에 승인 대기 ${pendingToday.length}건이 있습니다.</div>` : ""}
        <div class="card" style="padding:16px">
          ${adminCalMode === "day" ? renderLedger(adminDate, true) : renderMonthCalendar("adminMonthCal", adminDate)}
        </div>
      </div>
    </div>`;

  document.getElementById("signOutBtn2").addEventListener("click", () => signOut(auth));
  document.getElementById("csvExportBtn").addEventListener("click", () => exportCsv(list));

  if (list.length > 0) {
    const selectAllCb = document.getElementById("selectAllCheckbox");
    const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");
    const countEl = document.getElementById("selectedCount");
    const rowCheckboxes = () => Array.from(document.querySelectorAll("#adminList .res-checkbox"));

    function updateBulkUi() {
      const checked = rowCheckboxes().filter((cb) => cb.checked);
      countEl.textContent = checked.length > 0 ? `${checked.length}건 선택됨` : "";
      bulkDeleteBtn.disabled = checked.length === 0;
      selectAllCb.checked = checked.length > 0 && checked.length === rowCheckboxes().length;
    }
    updateBulkUi();

    selectAllCb.addEventListener("change", () => {
      rowCheckboxes().forEach((cb) => { cb.checked = selectAllCb.checked; });
      updateBulkUi();
    });
    document.getElementById("adminList").addEventListener("change", (e) => {
      if (e.target.classList.contains("res-checkbox")) updateBulkUi();
    });

    bulkDeleteBtn.addEventListener("click", async () => {
      const ids = rowCheckboxes().filter((cb) => cb.checked).map((cb) => cb.dataset.id);
      if (ids.length === 0) return;
      const ok = window.confirm(`선택한 ${ids.length}건을 완전히 삭제합니다.\n삭제하면 되돌릴 수 없습니다. 계속하시겠습니까?`);
      if (!ok) return;
      bulkDeleteBtn.disabled = true;
      bulkDeleteBtn.textContent = "삭제 중…";
      try {
        await Promise.all(ids.map((id) => deleteDoc(doc(db, "reservations", id))));
      } catch (err) {
        alert(`삭제 중 오류가 발생했습니다: ${err.message}`);
      } finally {
        bulkDeleteBtn.textContent = "🗑 선택 삭제";
      }
    });
  }
  wireDateNav("adminDateNav", () => adminDate, (d) => { adminDate = d; renderAdminView(); });
  document.querySelectorAll('#adminView [data-viewmode]').forEach((btn) => {
    btn.addEventListener("click", () => { adminCalMode = btn.dataset.viewmode; renderAdminView(); });
  });
  if (adminCalMode === "month") {
    wireMonthCalendar("adminMonthCal", () => adminDate,
      (d) => { adminDate = d; renderAdminView(); },
      (d) => { adminDate = d; adminCalMode = "day"; renderAdminView(); }
    );
  }

  document.querySelectorAll("#adminView [data-filter]").forEach(btn => {
    btn.addEventListener("click", () => { adminFilter = btn.dataset.filter; renderAdminView(); });
  });
  document.querySelectorAll("#adminView [data-roomfilter]").forEach(btn => {
    btn.addEventListener("click", () => { adminRoomFilter = btn.dataset.roomfilter; renderAdminView(); });
  });

  let processingId = null;

  document.getElementById("adminList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    const target = reservations.find(r => r.id === id);
    if (!target) return;
    if (act === "printAgreement") { printAgreement(target); return; }
    if (processingId === id) return; // 같은 건 중복 클릭 방지

    if (act === "approve") {
      // 화면에 보이는 최신 데이터로 1차 확인 (사용자에게 빠른 피드백)
      const conflict = reservations.find(r => r.id !== id && r.date === target.date &&
        roomIdOf(r) === roomIdOf(target) && r.status === "approved" &&
        overlaps(target.startTime, target.endTime, r.startTime, r.endTime));
      if (conflict) {
        alert(`${roomNameOf(target)}에 이미 승인된 다른 예약(${conflict.startTime}~${conflict.endTime}, ${conflict.eventName})과 겹쳐 승인할 수 없습니다.`);
        return;
      }
      processingId = id;
      btn.disabled = true;
      try {
        // 트랜잭션으로 서버의 최신 상태를 다시 확인 후 승인 (여러 담당자가 동시에 처리하는 경우 대비)
        await runTransaction(db, async (tx) => {
          const targetRef = doc(db, "reservations", id);
          const targetSnap = await tx.get(targetRef);
          if (!targetSnap.exists() || targetSnap.data().status !== "pending") {
            throw new Error("이미 다른 담당자가 처리한 건입니다. 화면을 새로고침해 주세요.");
          }
          if (conflict) {
            const conflictRef = doc(db, "reservations", conflict.id);
            const conflictSnap = await tx.get(conflictRef);
            if (conflictSnap.exists() && conflictSnap.data().status === "approved") {
              throw new Error("방금 다른 담당자가 겹치는 시간대를 먼저 승인했습니다. 목록을 확인해 주세요.");
            }
          }
          tx.update(targetRef, {
            status: "approved", rejectReason: "",
            processedBy: currentUser.email, processedAt: new Date().toISOString(),
          });
        });
      } catch (err) {
        alert(`승인 처리 중 문제가 발생했습니다: ${err.message}`);
      } finally {
        processingId = null;
        btn.disabled = false;
      }
    } else if (act === "reject") {
      const reason = window.prompt("거절 사유를 입력해 주세요.", "");
      if (reason === null) return;
      if (!reason.trim()) { alert("거절 사유를 입력해야 합니다."); return; }
      processingId = id;
      btn.disabled = true;
      try {
        await updateDoc(doc(db, "reservations", id), {
          status: "rejected", rejectReason: reason.trim(),
          processedBy: currentUser.email, processedAt: new Date().toISOString(),
        });
      } catch (err) {
        alert(`거절 처리 중 오류: ${err.message}`);
      } finally {
        processingId = null;
        btn.disabled = false;
      }
    } else if (act === "reopen") {
      processingId = id;
      btn.disabled = true;
      try {
        await updateDoc(doc(db, "reservations", id), {
          status: "pending", rejectReason: "",
          processedBy: currentUser.email, processedAt: new Date().toISOString(),
        });
      } catch (err) {
        alert(`처리 중 오류: ${err.message}`);
      } finally {
        processingId = null;
        btn.disabled = false;
      }
    }
  });
}

renderAll();
</script>
</body>
</html>
